<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery</title>
    <link rel="icon" type="image/png" href="./img/favicon.png" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/index.css" />

    <!-- Scripts -->
    <script src="./js/htmx.min.js"></script>
  </head>
  <body>
    <header
      class="header-menu"
      data-hx-trigger="load"
      data-hx-swap="outerHTML"
      data-hx-get="index.header.partial.html"
    ></header>
    <main>
      <section
        data-hx-trigger="load"
        data-hx-swap="outerHTML"
        data-hx-get="index.hero.partial.html"
      ></section>

      <section class="add-item container">
        <div class="add-item__container">
          <h2>Add product</h2>
          <label for="name">Name</label>
          <input
            class="form__input add-item__input--name"
            type="text"
            required
          />
          <label for="price">Price</label>
          <input
            class="form__input add-item__input--price"
            type="text"
            required
          />

          <div class="add-item__button-wrapper">
            <button
              type="submit"
              class="add-item__button add-item__button--add"
            >
              Add
            </button>
            <button
              type="button"
              class="add-item__button add-item__button--cancel"
            >
              Cancel
            </button>
          </div>
        </div>
      </section>
    </main>
    <footer
      data-hx-trigger="load"
      data-hx-swap="outerHTML"
      data-hx-get="footer.partial.html"
    ></footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/add.item.js"></script>
  </body>
</html>

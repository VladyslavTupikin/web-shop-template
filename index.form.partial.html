<section class="form">
  <!-- <div class="form-wrapper"></div> -->
  <dialog class="form-dialog">
    <form class="form-container">
      <h2 class="form__title">Update product</h2>

      <label class="form__label form__label--name" for="name">Name:</label>
      <input
        class="form__input form__input--name"
        type="text"
        class="product-name"
        required
      />

      <label class="form__label form__label--price" for="price">Price:</label>
      <input
        class="form__input form__input--price"
        type="text"
        class="product-price"
        required
      />

      <div class="form__button-wrapper">
        <button type="submit" class="form__button form__button--update">
          Update
        </button>
        <button type="button" class="form__button form__button--close">
          Cancel
        </button>
      </div>
    </form>
  </dialog>
</section>
